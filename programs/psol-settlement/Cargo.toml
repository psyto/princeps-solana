[package]
name         = "psol-settlement"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
authors      = { workspace = true }
publish      = { workspace = true }

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
psol-types        = { workspace = true }
pinocchio         = { workspace = true }
pinocchio-pubkey  = { workspace = true }
pinocchio-system  = { workspace = true }
bytemuck          = { workspace = true }

[dev-dependencies]
litesvm                      = "0.9.1"
solana-instruction           = "3"
solana-keypair               = "3"
solana-signer                = "3"
solana-address               = "2.6"
solana-transaction           = "3"
solana-message               = "3"
solana-system-interface      = "3"
solana-program-pack          = "3"
spl-token-2022               = { version = "10", features = ["no-entrypoint"] }
psol-compliance              = { path = "../psol-compliance", features = ["no-entrypoint"] }
